# Fly.io configuration for Werewolf Arena Backend (Apps V1)

app = "werewolf-arena-backend"

kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]
  PYTHONPATH = "/app"
  PYTHONUNBUFFERED = "1"
  PORT = "8000"
  ENVIRONMENT = "production"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

  [[services.http_checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/health"
    protocol = "http"
    restart_limit = 0
    timeout = "5s"

[deploy]
  strategy = "canary"
