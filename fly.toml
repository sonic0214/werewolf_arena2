app = "werewolf-arena"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  PYTHONUNBUFFERED = "1"
  BACKEND_PORT = "8000"
  FRONTEND_PORT = "3000"
  BACKEND_URL = "http://127.0.0.1:8000"
  NEXT_PUBLIC_API_URL = "/api"
  NEXT_PUBLIC_WS_URL = "wss://werewolf-arena.fly.dev:8443"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "5s"
  method = "GET"
  path = "/"

[[http_service.concurrency]]
  type = "requests"
  soft_limit = 200
  hard_limit = 250

[[services]]
  internal_port = 8000
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    port = 8080
    handlers = ["http"]

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

  [[services.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
