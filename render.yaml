services:
  # 统一的Web服务 - 包含前端和后端 (Render单端口模式)
  - type: web
    name: werewolf-arena
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    startCommand: /app/start.sh
    healthCheck:
      path: /health
    envVars:
      # 基础配置
      - key: NODE_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      - key: SERVER__HOST
        value: 0.0.0.0

      # URL配置
      - key: BACKEND_URL
        value: https://werewolf-arena.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_WS_URL
        value: wss://werewolf-arena.onrender.com

      # LLM配置 - 重要：需要在Render控制台中设置实际的API密钥
      # 注意：环境变量名要与settings.py中的字段名匹配（下划线分隔）
      - key: siliconflow_api_key
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # 游戏配置
      - key: GAME_TIMEOUT_SECONDS
        value: 300
      - key: MAX_PLAYERS
        value: 20
      - key: MIN_PLAYERS
        value: 4
      - key: DEBUG
        value: "false"

databases:
  # 如果需要数据库，可以添加PostgreSQL
  # - name: werewolf-arena-db
